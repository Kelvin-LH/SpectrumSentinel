[project]
name = "spectrum-sentinel"
version = "0.1.0"
description = "谱鉴：H5 智能信号检测产品演示台"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
